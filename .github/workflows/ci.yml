name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

  godot-quality:
    name: Godot quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: Verify gdtoolkit
        run: gdlint --version

      - name: Lint project GDScript
        run: gdlint autoload scenes scripts tests

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Install pinned Godot addons
        shell: pwsh
        run: ./tools/setup-dev-tools.ps1 -Force

      - name: Import and parse project
        run: godot --headless --path . --editor --quit

      - name: Run smoke tests
        run: godot --headless --path . --script tests/smoke_match_rules.gd

      - name: Run GdUnit4 tests
        run: >-
          godot --headless --path .
          --script res://addons/gdUnit4/bin/GdUnitCmdTool.gd
          --ignoreHeadlessMode
          --continue
          --add tests/unit

  windows-build:
    name: Windows release export
    runs-on: ubuntu-latest
    needs: godot-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7 with templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Install pinned Godot addons
        shell: pwsh
        run: ./tools/setup-dev-tools.ps1 -Force

      - name: Export Windows release
        shell: pwsh
        run: ./tools/build-windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodsAndLiars-Windows
          path: build/windows/
          if-no-files-found: error
