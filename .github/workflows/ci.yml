name: CI

on:
  push:
  pull_request:

jobs:
  godot-headless-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import and parse project
        run: godot --headless --path . --editor --quit

      - name: Run FASE 0 smoke tests
        run: godot --headless --path . --script tests/smoke_match_rules.gd
