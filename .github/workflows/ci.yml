name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -fsSL "$URL" -o "/tmp/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history for secrets
        run: gitleaks detect --source . --redact --verbose

  godot-quality:
    name: Godot quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: Verify gdtoolkit
        run: gdlint --version

      - name: Lint project GDScript
        run: gdlint autoload scenes scripts tests

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Install pinned Godot addons
        shell: pwsh
        run: ./tools/setup-dev-tools.ps1 -Force

      - name: Import and parse project
        run: godot --headless --path . --editor --quit

      - name: Run smoke tests
        run: godot --headless --path . --script tests/smoke_match_rules.gd

      - name: Run Gate A logical acceptance
        run: godot --headless --path . --script tests/acceptance/gate_a_logical_game.gd

      - name: Run Gate B adversarial stress
        run: godot --headless --path . --script tests/acceptance/gate_b_adversarial_stress.gd

      - name: Run GdUnit4 tests
        run: >-
          godot --headless --path .
          --script res://addons/gdUnit4/bin/GdUnitCmdTool.gd
          --ignoreHeadlessMode
          --continue
          --add tests/unit

  windows-build:
    name: Windows release export
    runs-on: ubuntu-latest
    needs: godot-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7 with templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Install pinned Godot addons
        shell: pwsh
        run: ./tools/setup-dev-tools.ps1 -Force

      - name: Export Windows release
        shell: pwsh
        run: ./tools/build-windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodsAndLiars-Windows
          path: build/windows/
          if-no-files-found: error

  steam-runtime:
    name: Steam multiplayer runtime export
    runs-on: ubuntu-latest
    needs: godot-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Godot addons
        shell: pwsh
        run: ./tools/setup-dev-tools.ps1 -Force

      - name: Setup pinned GodotSteam 4.20 runtime
        shell: pwsh
        run: ./tools/setup-godotsteam-runtime.ps1

      - name: Resolve GodotSteam editor
        id: godotsteam
        shell: pwsh
        run: |
          $editor = (Get-Content .tools/godotsteam/editor-path.txt -Raw).Trim()
          "editor=$editor" >> $env:GITHUB_OUTPUT
          & $editor --version
          if ($LASTEXITCODE -ne 0) { throw "GodotSteam editor failed to start" }

      - name: Verify Steam + SteamMultiplayerPeer
        shell: pwsh
        run: |
          $editor = "${{ steps.godotsteam.outputs.editor }}"
          & $editor --headless --path . --script res://tools/verify-steam-runtime.gd
          if ($LASTEXITCODE -ne 0) { throw "GodotSteam multiplayer runtime gate failed" }

      - name: Export Steam-capable Windows release
        shell: pwsh
        run: |
          $editor = "${{ steps.godotsteam.outputs.editor }}"
          ./tools/build-windows.ps1 -GodotBinary $editor -Output "build/steam-windows/GodsAndLiars.exe"

      - name: Assemble and validate Steam Windows runtime
        shell: pwsh
        run: |
          $out = "build/steam-windows"
          $steamDll = ".tools/godotsteam/templates-expanded/win64/steam_api64.dll"
          if (-not (Test-Path $steamDll)) { throw "steam_api64.dll missing from pinned GodotSteam runtime" }
          if (-not (Test-Path "steam_appid.txt")) { throw "steam_appid.txt missing from repository" }
          Copy-Item $steamDll "$out/steam_api64.dll" -Force
          Copy-Item "steam_appid.txt" "$out/steam_appid.txt" -Force

          $required = @(
            "$out/GodsAndLiars.exe",
            "$out/steam_api64.dll",
            "$out/steam_appid.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Steam Windows artifact missing required file: $file" }
            if ((Get-Item $file).Length -le 0) { throw "Steam Windows artifact contains empty file: $file" }
          }

          $appId = (Get-Content "$out/steam_appid.txt" -Raw).Trim()
          if ($appId -ne "480") { throw "Expected development Steam App ID 480, got '$appId'" }
          Write-Host "GREEN: complete Steam Windows runtime assembled"

      - name: Upload Steam Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodsAndLiars-Steam-Windows
          path: build/steam-windows/
          if-no-files-found: error
